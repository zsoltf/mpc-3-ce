# Installed as /usr/lib/systemd/system/acvs.service.d/50-mpclearn.conf.
# Akai's acvs.service stays the only owner of the MPC process (Restart=always,
# its name, dependencies and ordering unchanged). Each instance starts through
# the image launcher, which is stock by default and adds the CE runtime only for
# an admitted session; every instance exit is closed for that session.
[Service]
ExecStart=
ExecStart=/usr/share/mpclearn/mcu/mcu-boot.sh launch
ExecStopPost=-/usr/share/mpclearn/mcu/mcu-boot.sh close
